# nginx proxy address - http://172.17.0.1:64315

name: privatebin
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  privatebin:
    image: privatebin/nginx-fpm-alpine:latest
    container_name: privatebin-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: privatebin-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PHP_TZ: ${TZ:-America/New_York}
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8080']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64315:8080'
    volumes:
      - './volumes/config/privatebin:/srv/cfg:z'
      - './volumes/data/privatebin:/srv/data:z'
    networks:
      - privatebin

networks:
  privatebin:
    name: privatebin
    external: false
